# Continuously replicates the SQLite database to a Backblaze B2 bucket (S3-compatible).
# Credentials come from LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: ${PAYDAYLY_DATA_DIR}/paydayly.db
    replicas:
      - type: s3
        bucket: ${B2_BUCKET}
        path: paydayly
        endpoint: ${B2_ENDPOINT}
        region: ${B2_REGION}
        force-path-style: true
        retention: 72h
