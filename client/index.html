    <title>Paydayly - Plan your payday. Know what's left.</title>
    <script>
      try {
        var t = localStorage.getItem("paydayly-theme") || localStorage.getItem(["b", "aaki-theme"].join("")) || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
